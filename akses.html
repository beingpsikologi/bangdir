<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyBeing | Pengembangan Diri</title>
<style>
:root{--g:#174b3a;--bg:#f5f8f6;--card:#fff;--mut:#6b7771;--line:#dfe8e3}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:#1f2a25}
.wrap{max-width:900px;margin:auto;padding:24px}.brand{font-weight:800;color:var(--g);margin:10px 0 28px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 8px 24px rgba(23,75,58,.06)}
input{width:100%;padding:12px;border:1px solid #cad8d1;border-radius:12px;font:inherit}button,a.btn{display:inline-block;border:0;border-radius:12px;padding:12px 16px;background:var(--g);color:white;font-weight:800;text-decoration:none;cursor:pointer}
.material{padding:15px 0;border-top:1px solid var(--line)}.material:first-child{border-top:0}.mut{color:var(--mut)}.hidden{display:none}
</style>
</head>
<body><div class="wrap">
<div class="brand">BEING • MyBeing</div>
<div class="card">
<h1>MyBeing • Akses Peserta</h1>
<p class="mut">Masukkan kode akses yang dikirim admin. Jika link Anda sudah berisi kode, halaman akan terbuka otomatis.</p>
<form id="login"><input id="token" placeholder="Contoh: BEING-A73K2" required><button style="margin-top:12px">Buka Materi</button></form>
<div id="err" class="mut" style="margin-top:12px"></div>
</div>
<div id="portal" class="hidden">
  <div class="card"><h2 id="welcome"></h2><p id="program"></p></div>
  <div class="card"><h2>Materi Program</h2><div id="materials"></div></div>
</div>
</div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbzvEgNEROBTjx6N3itbJGXVen2OGsV7zDYZeKRiNcmcVDaWkIG9i0BzijTAOS-82QqR/exec';
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function normalizeAccessInput(value){
  const raw=String(value||'').trim();
  if(!raw) return '';

  // If user pastes a full access URL, extract ?access=...
  try{
    const u=new URL(raw);
    const token=u.searchParams.get('access');
    if(token) return token.trim();
  }catch(_){}

  // If user pastes something containing ?access= but URL parsing fails
  const m=raw.match(/[?&]access=([^&#]+)/i);
  if(m && m[1]){
    try{return decodeURIComponent(m[1]).trim()}catch(_){return m[1].trim()}
  }

  return raw;
}

async function api(params){const u=new URL(API_URL);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u);return r.json()}
async function openPortal(t){
  t=normalizeAccessInput(t);
  err.textContent='Memuat...'; portal.classList.add('hidden');
  try{
    const x=await api({action:'portal',token:t});
    if(!x.ok){err.textContent=x.message||'Kode akses tidak valid.';return}
    err.textContent=''; token.value=t;
    welcome.textContent='Halo, '+x.data.peserta.nama;
    program.textContent=x.data.program.nama;
    const list=x.data.materi||[];
    materials.innerHTML=list.length?list.map(m=>`<div class="material"><h3>${esc(m.judul)}</h3><p class="mut">${esc(m.deskripsi||'')}</p><a class="btn" href="${esc(m.link)}" target="_blank" rel="noopener">Buka / Download</a></div>`).join(''):'<p class="mut">Belum ada materi yang dipublikasikan.</p>';
    portal.classList.remove('hidden');
  }catch(e){err.textContent='API belum terhubung atau koneksi bermasalah.'}
}
login.addEventListener('submit',e=>{e.preventDefault();openPortal(token.value.trim())});
const q=new URLSearchParams(location.search).get('access'); if(q){token.value=q;openPortal(q)}
</script>
</body></html>
